name: kea-cb-release-validation
services:
  postgres:
    image: postgres:15.18-bookworm@sha256:e8db9bd3e9e1751eb639fb17be53cc6d1b62a322adf75b99e791767a7a16ce69
    platform: linux/amd64
    environment:
      POSTGRES_USER: kea_test
      POSTGRES_PASSWORD: docker-only-not-a-secret
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kea_test']
      interval: 2s
      timeout: 5s
      retries: 30
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [test]
  mariadb:
    image: mariadb:10.11.16@sha256:8a99982dced50264560fd8ada91aa34c276636bc02713f01f252c540930f9915
    platform: linux/amd64
    environment:
      MARIADB_ROOT_PASSWORD: docker-only-not-a-secret
      MARIADB_ROOT_HOST: '%'
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes: [mariadb-data:/var/lib/mysql]
    networks: [test]
  kea:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
    platform: linux/amd64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres: {condition: service_healthy}
      mariadb: {condition: service_healthy}
    volumes: [evidence:/evidence]
    networks: [test]
networks:
  test:
    internal: true
volumes:
  postgres-data:
  mariadb-data:
  evidence:
