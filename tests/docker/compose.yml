name: kea-cb-release-validation
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    platform: linux/amd64
    environment:
      POSTGRES_USER: kea_test
      POSTGRES_PASSWORD: docker-only-not-a-secret
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kea_test']
      interval: 2s
      timeout: 5s
      retries: 30
    volumes: [postgres18-data:/var/lib/postgresql]
    networks: [test]
  mariadb:
    image: mariadb:12.3.3@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
    platform: linux/amd64
    environment:
      MARIADB_ROOT_PASSWORD: docker-only-not-a-secret
      MARIADB_ROOT_HOST: '%'
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes: [mariadb123-data:/var/lib/mysql]
    networks: [test]
  kea:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
    platform: linux/amd64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres: {condition: service_healthy}
      mariadb: {condition: service_healthy}
    volumes: [evidence:/evidence]
    networks: [test]
networks:
  test:
    internal: true
volumes:
  postgres18-data:
  mariadb123-data:
  evidence:
