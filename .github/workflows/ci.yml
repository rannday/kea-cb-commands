name: Linux Kea hook
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kea: ['3.2.1', '3.0.4']
    env:
      KEA_VERSION: ${{ matrix.kea }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ephemeral runner prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config meson python3 \
            bison flex curl ca-certificates libboost-dev libboost-system-dev \
            liblog4cplus-dev libssl-dev libpq-dev default-libmysqlclient-dev
      - name: Build matching upstream shared Kea
        run: |
          export KEA_PREFIX="$GITHUB_WORKSPACE/.local/kea/$KEA_VERSION"
          mkdir -p .upstream
          curl --fail --location --retry 2 \
            "https://github.com/isc-projects/kea/archive/refs/tags/Kea-$KEA_VERSION.tar.gz" \
            --output .upstream/kea.tar.gz
          tar -xzf .upstream/kea.tar.gz -C .upstream
          meson setup build-kea ".upstream/kea-Kea-$KEA_VERSION" \
            --prefix="$KEA_PREFIX" --libdir=lib --buildtype=debugoptimized \
            -Dcpp_std=c++14 -Dcrypto=openssl -Dmysql=enabled \
            -Dpostgresql=enabled -Dkrb5=disabled -Dnetconf=disabled
          meson compile -C build-kea -j 2
          meson install -C build-kea
          echo "KEA_PREFIX=$KEA_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$KEA_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$KEA_PREFIX/lib" >> "$GITHUB_ENV"
          echo "$KEA_PREFIX/sbin" >> "$GITHUB_PATH"
          echo "$KEA_PREFIX/bin" >> "$GITHUB_PATH"
      - name: Build and test hook
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DKEA_DB_COMMANDS_RUNTIME_TESTS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          nm -D --defined-only build/libdhcp_db_commands.so
          ldd build/libdhcp_db_commands.so
