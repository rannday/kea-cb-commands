name: Linux Kea acceptance

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install isolated quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-venv
          python3 -m venv build/quality
          build/quality/bin/pip install --require-hashes --only-binary=:all: -r scripts/requirements-quality.txt
          echo "$GITHUB_WORKSPACE/build/quality/bin" >> "$GITHUB_PATH"
      - name: Formatting, lint, documentation and whitespace
        run: python3 scripts/quality.py
      - name: Python unit tests
        run: |
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v

  integration:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install ephemeral runner prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config python3-venv bison flex \
            ca-certificates libboost-dev libboost-system-dev liblog4cplus-dev \
            libssl-dev libpq-dev libmariadb-dev libmariadb-dev-compat \
            postgresql postgresql-client mariadb-server mariadb-client \
            iproute2 util-linux apparmor binutils
          python3 -m venv build/quality
          build/quality/bin/pip install --require-hashes --only-binary=:all: -r scripts/requirements-quality.txt
          echo "$GITHUB_WORKSPACE/build/quality/bin" >> "$GITHUB_PATH"
      - name: Permit user namespaces for the test-only unshare executable
        run: |
          mkdir -p "$RUNNER_TEMP/kea-userns"
          install -m 755 /usr/bin/unshare "$RUNNER_TEMP/kea-userns/unshare"
          cat > "$RUNNER_TEMP/kea-userns/profile" <<EOF_PROFILE
          abi <abi/4.0>,
          include <tunables/global>
          profile kea-cb-ci-userns "$RUNNER_TEMP/kea-userns/unshare" flags=(unconfined) {
            userns,
          }
          EOF_PROFILE
          sudo apparmor_parser -r "$RUNNER_TEMP/kea-userns/profile"
          echo "$RUNNER_TEMP/kea-userns" >> "$GITHUB_PATH"
      - name: Build verified upstream Kea 3.2.1 from scratch
        run: python3 scripts/build_kea.py --work-dir build/upstream --jobs 2 > build/upstream.log 2>&1
      - name: Build hook with warnings as errors and require every integration test
        run: python3 scripts/integration.py --kea-prefix build/upstream/install --build-dir build/integration --jobs 2 > build/integration.log 2>&1
      - name: Package the tested hook
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 -B scripts/package_release.py --kea-prefix build/upstream/install \
            --build-dir build/integration --output-dir build/release --tag "$RELEASE_TAG" \
            > build/packaging.log 2>&1
      - name: Verify checksum and install the packaged hook
        run: |
          cd build/release
          sha256sum --check *.sha256
          tar -tzf *.tar.gz > ../archive-contents.txt
          cd ../..
          mkdir -p build/package-stage
          tar -xzf build/release/*.tar.gz -C build/package-stage --strip-components=1
          python3 scripts/verify_artifact.py \
            --library build/package-stage/lib/kea/hooks/libdhcp_db_commands.so \
            --kea-prefix build/upstream/install --forbid-path "$GITHUB_WORKSPACE"
          LD_LIBRARY_PATH="$PWD/build/upstream/install/lib" python3 -B tests/smoke.py \
            --server "$PWD/build/upstream/install/sbin/kea-dhcp4" \
            --hook "$PWD/build/package-stage/lib/kea/hooks/libdhcp_db_commands.so" \
            --work-dir "$PWD/build/packaged-lifecycle" > build/packaged-lifecycle.log 2>&1
      - name: Remove test-only AppArmor profile
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/kea-userns/profile"; then
            sudo apparmor_parser -R "$RUNNER_TEMP/kea-userns/profile"
          fi
      - name: Preserve verified release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: versioned-release
          retention-days: 7
          if-no-files-found: error
          path: |
            build/release/*.tar.gz
            build/release/*.sha256
      - name: Preserve build and test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kea-3.2.1-verification
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/upstream.log
            build/upstream/toolchain.txt
            build/upstream/config.report
            build/upstream/build/meson-logs/meson-log.txt
            build/integration.log
            build/packaging.log
            build/packaged-lifecycle.log
            build/archive-contents.txt
            build/integration/release-build.json
            build/integration/ctest-results.xml
            build/integration/Testing/Temporary/LastTest.log

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download verified artifacts from this run and publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name versioned-release --dir build/release
          cd build/release
          sha256sum --check *.sha256
          cd ../..
          gh release create "$RELEASE_TAG" build/release/*.tar.gz build/release/*.sha256 \
            --verify-tag --title "$RELEASE_TAG" --notes-file docs/release-notes.md
